<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informe de Resultados Agrícola Maní Campaña 26-27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f7f4; --surface:#ffffff; --surface-2:#f0f5f1; --border:#dfe7e1;
  --text:#14231a; --muted:#5d6f63; --grid:#e6ece8;
  --real:#16a34a; --ppto:#d97706; --bad:#dc2626; --good:#15803d; --neutral:#64748b;
  --h1:#0f3d24; --h2:#166534; --h3:#22a05a;
  --shadow:0 1px 2px rgba(16,40,24,.06),0 4px 14px rgba(16,40,24,.05);
}
[data-theme="dark"]{
  --bg:#0d1511; --surface:#142019; --surface-2:#1a2a21; --border:#25382d;
  --text:#e5efe8; --muted:#93a89a; --grid:#22332a;
  --real:#34d27a; --ppto:#f2a43a; --bad:#f87171; --good:#4ade80; --neutral:#94a3b8;
  --h1:#08261a; --h2:#0f4a2a; --h3:#15803d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
a{color:inherit}
.header{background:linear-gradient(120deg,var(--h1),var(--h2) 55%,var(--h3));color:#fff;padding:22px 28px 20px}
.header-inner{max-width:1440px;margin:0 auto;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.header .sub{margin-top:4px;font-size:13px;opacity:.85}
.hbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;padding:7px 12px;border-radius:8px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.22)}
.btn input{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.18);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#a3a3a3}
.dot.live{background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.dot.err{background:#f87171}
.dot.local{background:#fbbf24}
main{max-width:1440px;margin:0 auto;padding:20px 28px 40px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.filters .lbl{font-weight:600;margin-right:4px}
.chip{border:1px solid var(--border);background:var(--surface-2);color:var(--text);padding:5px 11px;border-radius:999px;font:inherit;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--h2);border-color:var(--h2);color:#fff}
.chip.ghost{background:transparent;color:var(--muted)}
.filters .count{margin-left:auto;color:var(--muted);font-size:12.5px}
.alerts{margin-bottom:16px}
.alerts summary{cursor:pointer;font-weight:600}
.alerts ul{margin:10px 0 0;padding-left:18px;color:var(--muted)}
.alerts li{margin:3px 0}
.alerts li.miss{color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--h3)}
.card .t{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.03em}
.card .v{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card .u{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.card .n{font-size:12px;color:var(--muted);margin-top:4px}
.card.na .v{font-size:16px;color:var(--bad);font-weight:600}
.card.extra::before{background:var(--ppto)}
.pos{color:var(--bad)} .neg{color:var(--good)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.full{margin-bottom:16px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ph h2{margin:0;font-size:15px;font-weight:600}
.ph .hint{font-size:12px;color:var(--muted)}
.chartbox{position:relative;height:320px}
.chartbox.tall{height:380px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.seg button.on{background:var(--h2);color:#fff}
.ph .seg.unit{margin-left:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
thead th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;background:var(--surface-2);position:sticky;top:0}
tbody tr:hover{background:var(--surface-2)}
tr.total td{font-weight:700;border-top:2px solid var(--border)}
tr.parent td:first-child{font-weight:600;cursor:pointer}
tr.child td:first-child{padding-left:30px;color:var(--muted)}
tr.child.hidden{display:none}
.caret{display:inline-block;width:14px;transition:transform .15s;color:var(--muted)}
.open .caret{transform:rotate(90deg)}
.tablewrap{overflow:auto;max-height:640px}
.bar{display:inline-block;height:8px;border-radius:4px;vertical-align:middle}
.devcell{display:inline-flex;align-items:center;gap:10px}
.devcell .track{width:84px;display:inline-flex;justify-content:flex-start}
.devcell .num{min-width:64px;text-align:right}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.na-txt{color:var(--muted);font-style:italic}
.footer{color:var(--muted);font-size:12px;text-align:center;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.modal .box{background:var(--surface);color:var(--text);border-radius:12px;padding:20px;width:min(520px,100%);box-shadow:var(--shadow)}
.modal h3{margin:0 0 12px}
.modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.modal input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text);font:inherit}
.modal .row{display:flex;gap:10px}.modal .row>div{flex:1}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.modal .actions button{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font:inherit;cursor:pointer}
.modal .actions button.primary{background:var(--h2);border-color:var(--h2);color:#fff}
.loading{display:flex;align-items:center;gap:10px;justify-content:center;padding:60px;color:var(--muted)}
.spin{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--h3);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div>
      <h1>Informe de Resultados Agrícola Maní Campaña 26-27</h1>
      <div class="sub">Costos reales (Cash flow MANI) vs Presupuesto anual MANI · valores en U$S/ha</div>
    </div>
    <div class="hbtns">
      <span class="pill"><span id="statusDot" class="dot"></span><span id="statusTxt">Conectando…</span></span>
      <button class="btn" id="btnRefresh" title="Volver a leer la planilla">⟳ Actualizar</button>
      <a class="btn" id="lnkSheet" target="_blank" rel="noopener">▦ Abrir Google Sheet</a>
      <label class="btn" title="Usar un .xlsx descargado si no hay conexión">⇪ Cargar .xlsx<input type="file" id="fileInput" accept=".xlsx,.xls"></label>
      <button class="btn" id="btnSettings" title="Configuración">⚙</button>
      <button class="btn" id="btnTheme" title="Modo claro / oscuro">☾ Oscuro</button>
    </div>
  </div>
</header>

<main>
  <div class="panel filters" id="filters">
    <span class="lbl">Meses</span>
    <button class="chip ghost" id="selAll">Todos</button>
    <button class="chip ghost" id="selNone">Ninguno</button>
    <button class="chip ghost" id="selExec" title="Meses con pagos reales cargados en el cash flow">Ejecutado a la fecha</button>
    <span id="monthChips" style="display:contents"></span>
    <span class="count" id="monthCount"></span>
  </div>

  <details class="panel alerts" id="alerts" style="display:none">
    <summary id="alertsSum">Datos no encontrados y avisos</summary>
    <ul id="alertsList"></ul>
  </details>

  <div id="content"><div class="loading"><div class="spin"></div>Leyendo Google Sheet…</div></div>

  <div class="footer" id="footer"></div>
</main>

<div class="modal" id="modal">
  <div class="box">
    <h3>Configuración de la fuente</h3>
    <label>ID de la Google Sheet</label>
    <input id="cfgId">
    <div class="row">
      <div><label>Hoja de costos reales</label><input id="cfgReal"></div>
      <div><label>Última columna</label><input id="cfgRealCol" maxlength="2"></div>
    </div>
    <div class="row">
      <div><label>Hoja de presupuesto</label><input id="cfgBud"></div>
      <div><label>Última columna</label><input id="cfgBudCol" maxlength="2"></div>
    </div>
    <label>Actualización automática (minutos, 0 = apagada)</label>
    <input id="cfgRefresh" type="number" min="0">
    <div class="actions">
      <button id="cfgReset">Restaurar</button>
      <button id="cfgCancel">Cancelar</button>
      <button id="cfgSave" class="primary">Guardar y recargar</button>
    </div>
  </div>
</div>

<!-- ====================== NÚCLEO DE LECTURA (sin DOM) ====================== -->
<script id="core">
const Core = (() => {
  const MONTHS = {ene:0,jan:0,feb:1,mar:2,abr:3,apr:3,may:4,jun:5,jul:6,ago:7,aug:7,sep:8,set:8,oct:9,nov:10,dic:11,dec:11};
  const MN = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
    .replace(/u\$s/g,'usd').replace(/[^a-z0-9%/ ]+/g,' ').replace(/\s+/g,' ').trim();
  const colIndex = L => { L = String(L||'').toUpperCase().trim(); let n = 0; for (const ch of L) n = n*26 + (ch.charCodeAt(0)-64); return n-1; };

  let decimalHint = '.';
  function detectDecimal(grid){
    let dot=0, comma=0;
    for (const row of grid) for (const v of row) {
      if (typeof v !== 'string') continue;
      const m = v.match(/\d[\d.,]*\d/); if (!m) continue; const s = m[0];
      if (s.includes('.') && s.includes(',')) { s.lastIndexOf(',') > s.lastIndexOf('.') ? comma++ : dot++; }
      else if (/^\d+,\d{1,2}$/.test(s)) comma++;
      else if (/^\d+\.\d{1,2}$/.test(s)) dot++;
    }
    decimalHint = comma > dot ? ',' : '.';
  }
  function parseNum(v){
    if (v == null) return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    if (v instanceof Date) return null;
    let s = String(v).trim(); if (!s) return null;
    if (/^[-–—]$/.test(s)) return 0;
    let neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1,-1); }
    s = s.replace(/u\$s|usd|us\$|ars|\$|\s| /gi,'');
    if (s.endsWith('%')) s = s.slice(0,-1);
    if (s.startsWith('-')) { neg = !neg; s = s.slice(1); }
    if (!/^[\d.,]+$/.test(s) || !/\d/.test(s)) return null;
    const nd = (s.match(/\./g)||[]).length, nc = (s.match(/,/g)||[]).length;
    let n;
    if (nd && nc) n = s.lastIndexOf('.') > s.lastIndexOf(',') ? +s.replace(/,/g,'') : +s.replace(/\./g,'').replace(',','.');
    else if (nc) n = nc > 1 ? +s.replace(/,/g,'') : (decimalHint === ',' ? +s.replace(',','.') : (/^\d{1,3},\d{3}$/.test(s) ? +s.replace(',','') : +s.replace(',','.')));
    else if (nd) n = nd > 1 ? +s.replace(/\./g,'') : (decimalHint === ',' && /^\d{1,3}\.\d{3}$/.test(s) ? +s.replace('.','') : +s);
    else n = +s;
    if (!isFinite(n)) return null;
    return neg ? -n : n;
  }
  function monthOf(v, allowSerial){
    let m=null, y=null;
    if (v instanceof Date) { const d = new Date(v.getTime()+43200000); m = d.getUTCMonth(); y = d.getUTCFullYear(); }
    else if (typeof v === 'number') {
      if (!allowSerial || v < 36000 || v > 60000 || !Number.isInteger(v)) return null;
      const d = new Date(Date.UTC(1899,11,30) + Math.round(v)*864e5); m = d.getUTCMonth(); y = d.getUTCFullYear();
    } else if (typeof v === 'string') {
      const s = norm(v); let x;
      if ((x = s.match(/^([a-z]+)[\s/]*('?\d{2,4})?$/)) && MONTHS[x[1].slice(0,3)] != null && (x[1].length===3 || x[1].length>=4)) {
        const full = x[1]; const k = full.slice(0,3);
        const ok = full.length===3 || ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','setiembre','octubre','noviembre','diciembre','january','february','march','april','june','july','august','september','october','november','december'].includes(full);
        if (!ok) return null;
        m = MONTHS[k]; if (x[2]) y = +x[2].replace("'",'');
      } else if ((x = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))) { m = +x[2]-1; y = +x[3]; }
      else if ((x = s.match(/^(\d{1,2})\/(\d{2,4})$/))) { m = +x[1]-1; y = +x[2]; }
      else return null;
    } else return null;
    if (m == null || m < 0 || m > 11) return null;
    if (y != null && y < 100) y += 2000;
    const label = MN[m] + (y ? '-' + String(y).slice(-2) : '');
    return { m, y, label, key: label };
  }

  const RESULT_RX = /\b(ingreso|ingresos|venta|ventas|precio|precios|rinde|rindes|margen|resultado|resultados|utilidad|beneficio|produccion|cotizacion|tipo de cambio|saldo|saldos|hectareas|superficie|quintales|toneladas|financiamiento|aporte|aportes|prestamo|cobranza|cobranzas|retencion|retenciones)\b|^(has|ha|qq|tn)\b/;
  const GRAND_RX = /^(total|totales|total general|total costos?|total egresos?|total gastos?|costos? totales?|costo total|egresos totales|total costos? directos?)$|^(cash flow|presupuesto) campana/;
  const INCOME_SECTION_RX = /\b(ingreso|ingresos|venta|ventas|resultado|resultados|rinde|rindes|produccion|indicadores|margen)\b/;

  function parseSheet(grid, lastCol, layout){
    const out = { ok:false, rows:[], months:[], grid, notes:[] };
    grid = grid.map(r => (r||[]).slice(0, lastCol+1));
    out.grid = grid;
    detectDecimal(grid);
    // fila de meses
    let best = -1, bestCount = 0;
    for (let r = 0; r < Math.min(grid.length, 45); r++) {
      let c = 0; for (let k = 0; k < lastCol; k++) if (monthOf(grid[r][k], true)) c++;
      if (c > bestCount) { bestCount = c; best = r; }
    }
    let hr, first, last, start, antCol = -1;
    if (bestCount >= 3) {
      hr = best;
      const mcs = []; for (let c = 0; c < lastCol; c++) if (monthOf(grid[hr][c], true)) mcs.push(c);
      first = mcs[0]; last = mcs[mcs.length-1]; start = monthOf(grid[hr][first], true);
      for (let c = 0; c < first; c++) if (/anterior/.test(norm(grid[hr][c]))) antCol = c;
    } else if (layout) {
      hr = layout.headerRow; first = layout.first; last = layout.last; antCol = layout.antCol ?? -1; start = { m: layout.startM, y: layout.startY };
      out.notes.push('No se pudieron leer los encabezados de meses; se usó la ubicación estándar de las columnas.');
    } else { out.notes.push('No se encontró la fila con los meses (encabezados tipo "Ago-26").'); return out; }
    // meses consecutivos desde el primero (evita errores de año en encabezados cargados como fecha)
    if (antCol >= 0) out.months.push({ c: antCol, key: 'Anteriores', label: 'Anteriores', m: null, y: null });
    for (let c = first, i = 0; c <= last; c++, i++) {
      const m = (start.m + i) % 12, y = start.y ? start.y + Math.floor((start.m + i) / 12) : null;
      const key = MN[m] + (y ? '-' + String(y).slice(-2) : '');
      out.months.push({ c, key, label: key, m, y });
    }
    out.headerRow = hr;
    out.totalCol = lastCol;
    out.totalHeader = grid[hr][lastCol] ?? (grid[hr-1]||[])[lastCol] ?? '';
    const firstMC = Math.min(...out.months.map(x => x.c));
    // filas
    let section = '';
    for (let r = hr+1; r < grid.length; r++) {
      const row = grid[r] || [];
      let label = null, lvl = 0, indent = 0;
      for (let c = 0; c < firstMC; c++) {
        const v = row[c];
        if (typeof v === 'string' && v.trim() && parseNum(v) == null) { label = v.trim(); lvl = c; indent = (v.match(/^\s*/)[0]||'').length; break; }
      }
      if (!label) continue;
      const months = {}; let any = false;
      for (const mc of out.months) { const n = parseNum(row[mc.c]); months[mc.key] = n; if (n != null && n !== 0) any = true; }
      const total = parseNum(row[lastCol]); if (total != null && total !== 0) any = true;
      if (!any) { // encabezado de sección o fila vacía
        const hasAnyNum = out.months.some(mc => parseNum(row[mc.c]) != null) || total != null;
        if (!hasAnyNum) { section = label; continue; }
      }
      out.rows.push({ r, label, n: norm(label), lvl, indent: Math.min(indent, 8), months, total, section, children: [], parent: null });
    }
    buildHierarchy(out);
    // signo (egresos cargados en negativo)
    const tops = out.rows.filter(x => !x.parent && !x.isResult && !x.isGrand);
    const neg = tops.filter(x => (x.total ?? sumMonths(x, out)) < 0).length, pos = tops.filter(x => (x.total ?? sumMonths(x, out)) > 0).length;
    out.sign = neg > pos ? -1 : 1;
    if (out.sign < 0) out.notes.push('Los costos figuran en negativo; se muestran en positivo.');
    // factor mensual -> U$S/ha
    const ratios = [];
    for (const x of out.rows) { const s = sumMonths(x, out); if (x.total && s && Math.sign(s) === Math.sign(x.total)) ratios.push(x.total / s); }
    ratios.sort((a,b) => a-b);
    out.factor = ratios.length ? ratios[Math.floor(ratios.length/2)] : 1;
    out.ok = true;
    return out;
  }
  function sumMonths(x, sh){ let s = 0; for (const mc of sh.months) s += x.months[mc.key] || 0; return s; }
  function vec(x, sh){ return [...sh.months.map(mc => x.months[mc.key] || 0), x.total || 0]; }
  function close(a, b){ return a.every((v,i) => Math.abs(v - b[i]) <= Math.max(0.02, Math.abs(b[i]) * 0.002)); }

  function buildHierarchy(sh){
    const rows = sh.rows;
    let afterGrand = false;
    for (const x of rows) {
      x.isGrand = GRAND_RX.test(x.n);
      x.isResult = afterGrand || RESULT_RX.test(x.n);
      if (x.isGrand && /egreso|costo|gasto|^total$/.test(x.n)) { afterGrand = true; sh.grandRow = x; }
    }
    const setParent = (p, kids) => { for (const k of kids) { if (k.parent) continue; k.parent = p; p.children.push(k); } };
    // 0) bloques separados por filas en blanco: la primera fila es el rubro, las siguientes su detalle
    const blocks = []; let cur = [];
    for (const x of rows) {
      if (x.isGrand || x.isResult) { if (cur.length) blocks.push(cur); cur = []; continue; }
      if (cur.length && x.r - cur[cur.length-1].r > 1) { blocks.push(cur); cur = []; }
      cur.push(x);
    }
    if (cur.length) blocks.push(cur);
    let nb = 0;
    if (blocks.length >= 3) for (const b of blocks) {
      if (b.length < 2) continue;
      const p = b[0], kids = b.slice(1), pv = vec(p, sh);
      const s = pv.map((_, j) => kids.reduce((a, z) => a + vec(z, sh)[j], 0));
      const tOk = Math.abs(s[s.length-1] - pv[pv.length-1]) <= Math.max(0.05, Math.abs(pv[pv.length-1]) * 0.01);
      if (close(s, pv) || tOk) { setParent(p, kids); nb++; }
    }
    if (nb >= 2) return;
    // 1) "Total X" debajo del detalle
    for (let i = 0; i < rows.length; i++) {
      const t = rows[i]; if (!/^total\b/.test(t.n) || t.isGrand) continue;
      const tv = vec(t, sh); if (tv.every(v => !v)) continue;
      for (let k = 2; k <= 20 && i-k >= 0; k++) {
        const kids = rows.slice(i-k, i); if (kids.some(z => z.parent || z.isResult)) break;
        const s = tv.map((_, j) => kids.reduce((a, z) => a + vec(z, sh)[j], 0));

      }
    }
    // 2) niveles visuales (columna / sangría)
    const cand = rows.filter(x => !x.isGrand);
    const depth = x => x.lvl * 10 + x.indent;
    const depths = new Set(cand.map(depth));
    let usedDepth = false;
    if (depths.size > 1) {
      const minD = Math.min(...depths);
      for (let i = 0; i < rows.length; i++) {
        const x = rows[i]; if (x.parent || x.isGrand || depth(x) === minD) continue;
        for (let j = i-1; j >= 0; j--) { const p = rows[j]; if (p.isGrand) break; if (depth(p) < depth(x)) { if (!p.parent || depth(p) > minD) { x.parent = p; p.children.push(x); usedDepth = true; } break; } }

    }
    // 3) rubro = suma de las filas siguientes
    if (!usedDepth) {
      for (let i = 0; i < rows.length; i++) {
        const p = rows[i]; if (p.parent || p.isGrand || p.children.length) continue;
        const pv = vec(p, sh); if (pv.every(v => !v)) continue;
        for (let k = 2; k <= 20 && i+k < rows.length + 1; k++) {
          const kids = rows.slice(i+1, i+1+k); if (kids.length < k) break;
          if (kids.some(z => z.parent || z.isGrand || z.children.length)) break;
          const s = pv.map((_, j) => kids.reduce((a, z) => a + vec(z, sh)[j], 0));
          if (close(s, pv)) { setParent(p, kids); i += k; break; }
        }
      }
    }
  }

  // emparejar etiquetas entre hojas
  const STOP = new Set(['de','del','la','el','los','las','y','e','en','por','para','a','usd','ha','/','x']);
  const toks = n => n.split(' ').filter(t => t && !STOP.has(t));
  function similar(a, b){
    if (a === b) return 1;
    if (a.length >= 4 && b.length >= 4 && (a.includes(b) || b.includes(a))) return 0.9;
    const A = new Set(toks(a)), B = new Set(toks(b)); if (!A.size || !B.size) return 0;
    let i = 0; for (const t of A) if (B.has(t)) i++;
    return i / (A.size + B.size - i);
  }

    for (const x of list) { if (used && used.has(x)) continue; const s = similar(n, x.n); if (s > bs) { bs = s; best = x; } }
    return bs >= 0.6 ? best : null;
  }

  // búsqueda de etiquetas en toda la hoja (para cards)
  function findInGrid(grid, test){
    const res = [];

      for (let c = 0; c < row.length; c++) {

        for (let k = c+1; k < row.length; k++) { const p = parseNum(row[k]); if (p != null && p !== 0) { val = p; vc = k; break; } }
        if (val == null) { const below = parseNum((grid[r+1]||[])[c]); if (below != null && below !== 0) { val = below; vc = c; } }
        res.push({ r, c, label: v.trim(), n, value: val, vc, row });
      }
    }
    return res;
  }

  return { norm, colIndex, parseNum, monthOf, parseSheet, sumMonths, match, similar, findInGrid, RESULT_RX };

function csvParse(t){
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i+1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += ch;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.map(r => r.map(v => v === '' ? null : v));
}
async function loadFromWorkbook(wb, label){
  const names = wb.SheetNames;
  const rn = pickSheet(names, cfg.realName, [/cash/, /mani/]);
  const bn = pickSheet(names, cfg.budgetName, [/presup/, /mani/]);
  const notes = [];
  if (!rn) notes.push({ miss:true, t:`No se encontró la hoja "${cfg.realName}". Hojas disponibles: ${names.join(', ')}` });
  if (!bn) notes.push({ miss:true, t:`No se encontró la hoja "${cfg.budgetName}". Hojas disponibles: ${names.join(', ')}` });
  const rl = Core.colIndex(cfg.realLastCol), bl = Core.colIndex(cfg.budgetLastCol);
  return buildModel(rn ? gridFromWs(wb.Sheets[rn], rl) : [], bn ? gridFromWs(wb.Sheets[bn], bl) : [], rl, bl, { rn, bn, label, notes });
}
function jsonpSheet(name, lastColLetter){
  return new Promise((resolve, reject) => {
    const cb = '__gsheet_' + Math.random().toString(36).slice(2);
    const sc = document.createElement('script');
    const done = () => { clearTimeout(t); try { delete window[cb]; } catch(e) { window[cb] = undefined; } sc.remove(); };
    const t = setTimeout(() => { done(); reject(new Error('Google no respondió (¿planilla no pública?)')); }, 12000);
    window[cb] = resp => {
      done();
      if (!resp || resp.status === 'error') return reject(new Error((resp && resp.errors && resp.errors[0] && (resp.errors[0].detailed_message || resp.errors[0].message)) || 'Error de Google'));
      const tb = resp.table, grid = [];
      (tb.rows || []).forEach(row => grid.push((row.c || []).map(cell => {
        if (!cell || cell.v == null) return null;
        const v = cell.v;
        if (typeof v === 'string') { const m = v.match(/^Date\((\d+),(\d+),(\d+)/); if (m) return new Date(+m[1], +m[2], +m[3], 12); }
        return v;
      })));
      resolve(grid);
    };
    sc.onerror = () => { done(); reject(new Error('No se pudo contactar a Google')); };
    sc.src = `https://docs.google.com/spreadsheets/d/${cfg.sheetId}/gviz/tq?tqx=out:json;responseHandler:${cb}&headers=0&range=A1:${lastColLetter}200&sheet=${encodeURIComponent(name)}&_=${Date.now()}`;
    document.head.appendChild(sc);
  });
}
async function loadLive(){
  setStatus('', 'Sincronizando…');
  let e0 = null;
  try { // método principal: funciona abriendo el archivo con doble clic
    const [g1, g2] = await Promise.all([jsonpSheet(cfg.realName, cfg.realLastCol), jsonpSheet(cfg.budgetName, cfg.budgetLastCol)]);
    state.model = buildModel(g1, g2, Core.colIndex(cfg.realLastCol), Core.colIndex(cfg.budgetLastCol), { rn:cfg.realName, bn:cfg.budgetName, label:'Google Sheets (en vivo)', notes:[] });
    state.source = 'live'; state.loadedAt = new Date();
    setStatus('live', 'En vivo · ' + state.loadedAt.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' }));
    render(); return;
  } catch (e) { e0 = e; }
  try {
    const res = await fetch(`https://docs.google.com/spreadsheets/d/${cfg.sheetId}/export?format=xlsx`, { cache:'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const buf = new Uint8Array(await res.arrayBuffer());
    if (!(buf[0] === 0x50 && buf[1] === 0x4b)) throw new Error('La planilla no es pública');
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    state.model = await loadFromWorkbook(wb, 'Google Sheets (en vivo)');
    state.source = 'live';
  } catch (e1) {
    try { // alternativa: CSV por nombre de hoja
      const get = async name => { const r = await fetch(`https://docs.google.com/spreadsheets/d/${cfg.sheetId}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(name)}`, { cache:'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); const t = await r.text(); if (/^\s*</.test(t)) throw new Error('La planilla no es pública'); return csvParse(t); };
      const [g1, g2] = await Promise.all([get(cfg.realName), get(cfg.budgetName)]);
      const rl = Core.colIndex(cfg.realLastCol), bl = Core.colIndex(cfg.budgetLastCol);
      state.model = buildModel(g1, g2, rl, bl, { rn:cfg.realName, bn:cfg.budgetName, label:'Google Sheets (modo CSV)', notes:[{ t:'Se leyó en modo CSV alternativo (el modo completo falló: ' + e1.message + '). Verificá que las columnas coincidan.' }] });
      state.source = 'live';
    } catch (e2) {
      if (state.model && state.source !== 'snapshot') { setStatus('err', 'Sin conexión · se mantienen los últimos datos'); return; }
      const toGrid = g => g.map(r => r.map(v => v && typeof v === 'object' && v.d ? new Date(v.d + 'T12:00:00') : v));
      const names = Object.keys(SNAPSHOT.sheets);
      const rn = names.find(n => /cash/i.test(n)), bn = names.find(n => /presup/i.test(n));
      state.model = buildModel(toGrid(SNAPSHOT.sheets[rn]), toGrid(SNAPSHOT.sheets[bn]), Core.colIndex(cfg.realLastCol), Core.colIndex(cfg.budgetLastCol),
        { rn, bn, label:`Copia del ${SNAPSHOT.date} (sin conexión)`, notes:[{ miss:true, t:`NO SE PUDO LEER LA GOOGLE SHEET EN VIVO: se muestran los datos del archivo del ${SNAPSHOT.date}. Si estás viendo esto dentro de la vista previa de Claude, descargá el index.html y abrilo con doble clic en Chrome/Edge. Verificá también que la planilla esté compartida como “Cualquier persona con el enlace · Lector”. (Detalle: ${e0 && e0.message} / ${e1.message} / ${e2.message})` }] });
      state.source = 'snapshot'; state.loadedAt = null;
      setStatus('local', `Sin conexión · datos del ${SNAPSHOT.date}`);
      render();
      return;
    }
  }
  state.loadedAt = new Date();
  setStatus('live', 'En vivo · ' + state.loadedAt.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' }));
  render();
}

/* ---------- modelo ---------- */
const LAYOUT = { // ubicación estándar si no se pueden leer los encabezados (modo CSV)
  real:   { headerRow:0, antCol:1, first:2, last:13, startM:7, startY:2026 },
  budget: { headerRow:1, antCol:1, first:2, last:15, startM:7, startY:2026 } };
const ACR = new Set(['TPS','AQ','BPA','UATRE','IV','CTO','ADM','U$S']);
const pretty = s => /[a-z]/.test(s) ? s : s.toLowerCase().replace(/(^|[\s(/])([a-záéíóúñ])/g, (m, a, b) => a + (a === '' ? b.toUpperCase() : b))
  .replace(/\b([a-z$]+)\b/gi, w => ACR.has(w.toUpperCase()) ? w.toUpperCase() : w).replace(/\brio\b/i, 'Río').replace(/^./, c => c.toUpperCase());
function buildModel(realGrid, budGrid, rl, bl, meta){
  const R = Core.parseSheet(realGrid, rl, LAYOUT.real), B = Core.parseSheet(budGrid, bl, LAYOUT.budget);
  const notes = [...meta.notes];
  for (const sh of [R, B]) for (const x of sh.rows) x.label = pretty(x.label);
  // la estructura rubro → detalle del presupuesto se aplica también al cash flow (mismo plan de cuentas)
  if (B.rows.filter(x => x.children.length).length >= 2 && R.rows.length) {
    for (const x of R.rows) { x.parent = null; x.children = []; }
    const topR = R.rows.filter(x => !x.isResult && !x.isGrand);
    for (const x of topR) {
      const b = Core.match(x.n, B.rows); if (!b || !b.parent) continue;
      const p = topR.find(z => z !== x && z.n === b.parent.n) || Core.match(b.parent.n, topR.filter(z => z !== x));
      if (p && !p.parent) { x.parent = p; p.children.push(x); }
    }
  }
  // hectáreas para pasar los montos mensuales (U$S) a U$S/ha
  const haHit = [B.grid, R.grid].map(g => Core.findInGrid(g || [], n => /^(total )?(hectareas|has)( mani| totales?| sembradas?)?$/.test(n)).find(x => x.value)).find(Boolean);
  if (haHit) { R.factor = B.factor = 1 / haHit.value; notes.push({ t:`Los montos mensuales (U$S) se pasan a U$S/ha dividiendo por ${haHit.value.toLocaleString('es-AR')} ha (fila “${haHit.label}”).` }); }
  else if (B.ok) notes.push({ t:'No se encontró la fila de hectáreas totales; los meses se pasan a U$S/ha con la relación total ÷ suma de meses.' });
  if (meta.rn) R.notes.forEach(t => notes.push({ t:'Cash flow: ' + t, miss:/No se encontró/.test(t) }));
  if (meta.bn) B.notes.forEach(t => notes.push({ t:'Presupuesto: ' + t, miss:/No se encontró/.test(t) }));
  // meses (orden: presupuesto, luego real)
  const months = []; const mk = new Set();
  for (const m of [...B.months, ...R.months]) if (!mk.has(m.key)) { mk.add(m.key); months.push(m); }
  if (months.every(m => m.y)) months.sort((a,b) => (a.y*12+a.m) - (b.y*12+b.m));
  // rubros
  const topB = B.rows.filter(x => !x.parent && !x.isResult && !x.isGrand);
  const topR = R.rows.filter(x => !x.parent && !x.isResult && !x.isGrand);
  const used = new Set(), rubros = [];
  for (const b of topB) {
    const r = Core.match(b.n, topR, used) || Core.match(b.n, R.rows.filter(z => !z.isResult), used);
    if (r) used.add(r);
    rubros.push(makeItem(b, r));
  }
  for (const r of topR) if (!used.has(r)) rubros.push(makeItem(null, r));
  function makeItem(b, r){
    const it = { label:(b||r).label, b, r, children:[] };
    const bc = b ? b.children : [], rc = r ? r.children : [], u = new Set();
    for (const x of bc) { const y = Core.match(x.n, rc, u); if (y) u.add(y); it.children.push({ label:x.label, b:x, r:y }); }
    for (const y of rc) if (!u.has(y)) it.children.push({ label:y.label, b:null, r:y });
    return it;
  }
  if (meta.rn && meta.bn && B.ok && R.ok) {
    const onlyB = rubros.filter(x => x.b && !x.r).map(x => x.label), onlyR = rubros.filter(x => !x.b && x.r).map(x => x.label);
    if (onlyB.length) notes.push({ t:'Rubros del presupuesto sin equivalente en el cash flow: ' + onlyB.join(', ') });
    if (onlyR.length) notes.push({ t:'Rubros del cash flow sin equivalente en el presupuesto: ' + onlyR.join(', ') });
  }
  return { R, B, months, rubros, notes, meta };
}

/* ---------- cálculos ---------- */
function val(row, sh, sel, all, usd){
  if (!row || !sh.ok) return null;
  const k = usd ? 1 / sh.factor : 1; // U$S/ha × hectáreas = U$S totales
  if (all && row.total != null) return row.total * sh.sign * k;
  let s = 0, any = false;
  for (const m of sel) { const v = row.months[m]; if (v != null) { s += v; any = true; } }
  return any || row.total == null ? s * sh.factor * sh.sign * k : 0;
}
function monthVal(row, sh, k, usd){ if (!row || !sh.ok) return null; const v = row.months[k]; return v == null ? 0 : v * sh.factor * sh.sign * (usd ? 1 / sh.factor : 1); }
function itemVals(it, sel, all, usd){ const M = state.model; const b = val(it.b, M.B, sel, all, usd), r = val(it.r, M.R, sel, all, usd); return { b, r, d: (r ?? 0) - (b ?? 0), p: b ? ((r ?? 0) - b) / Math.abs(b) : null }; }
const fv = (n, usd) => nf(n, usd ? 0 : 1);
const fAxis = (v, usd) => !usd ? nf(v, 0) : Math.abs(v) >= 1e6 ? nf(v/1e6, 1) + ' M' : Math.abs(v) >= 1e3 ? nf(v/1e3, 0) + ' mil' : nf(v, 0);
const uLbl = usd => usd ? 'U$S' : 'U$S/ha';
function findItem(rx){
  const M = state.model;
  for (const it of M.rubros) if (rx.test(Core.norm(it.label))) return it;
  for (const it of M.rubros) for (const c of it.children) if (rx.test(Core.norm(c.label))) return c;
  // filas sueltas
  const b = M.B.rows.find(x => rx.test(x.n)), r = M.R.rows.find(x => rx.test(x.n));
  return b || r ? { label:(b||r).label, b, r } : null;
}
function findLabor(rx){
  const M = state.model;
  const pick = rows => rows.filter(x => rx.test(x.n) && !x.isResult).sort((a,b) => (a.children.length - b.children.length) || (a.n.length - b.n.length))[0] || null;
  const b = pick(M.B.rows), r = pick(M.R.rows);
  return b || r ? { label:(b||r).label, b, r } : null;
}

/* ---------- cards ---------- */
function computeCards(sel, all){
  const M = state.model, gB = M.B.grid || [], gR = M.R.grid || [];
  const notes = [];
  const HA = /\b(has?|hect\w*|sup\w*|sembrad\w*)\b/;
  const firstVal = (grids, test) => { for (const g of grids) { const f = Core.findInGrid(g, test).find(x => x.value != null); if (f) return f; } return null; };
  const haO = firstVal([gB, gR], (n, rowTxt) => /olega/.test(n) && (HA.test(n) || HA.test(rowTxt)));
  const haS = firstVal([gB, gR], (n, rowTxt) => /socied|aparcer|asociad/.test(n) && !/olega/.test(n) && (HA.test(n) || HA.test(rowTxt)));
  const haTotRow = firstVal([gB, gR], n => /^(total )?(has|hectareas|superficie)( mani| total(es)?| sembradas?)?$/.test(n));
  const haTot = haO || haS ? (haO?.value || 0) + (haS?.value || 0) : haTotRow?.value ?? null;
  // rinde
  const rindes = Core.findInGrid(gB, n => /\brinde/.test(n)).filter(x => x.value != null);
  let rinde = rindes.find(x => /grano/.test(x.n)) || rindes[0] || null;
  let rindeQQ = rinde ? rinde.value : null, rindeNote = rinde ? `Fila: "${rinde.label}"` : '';
  if (rindeQQ != null && rindeQQ > 200) { rindeQQ = rindeQQ / 100; rindeNote += ' (convertido de kg/ha)'; }
  const rO = rindes.find(x => /olega/.test(x.n)), rS = rindes.find(x => /socied/.test(x.n));
  // producción
  let prod = null, prodNote = '';
  const pr = firstVal([gB], n => /produc/.test(n) && !/costo/.test(n));
  if (pr) { const u = Core.norm(pr.row.filter(z => typeof z === 'string').join(' ')); prod = /\bkg\b/.test(u) ? pr.value/1000 : /\bqq\b|quintal/.test(u) ? pr.value/10 : pr.value; prodNote = `Fila: "${pr.label}"`; }
  else if (rO && rS && haO && haS) { prod = (haO.value * (rO.value > 200 ? rO.value/100 : rO.value) + haS.value * (rS.value > 200 ? rS.value/100 : rS.value)) / 10; prodNote = 'Calculado: has × rinde de cada modalidad'; }
  else if (haTot != null && rindeQQ != null) { prod = haTot * rindeQQ / 10; prodNote = 'Calculado: has totales × rinde ÷ 10'; }
  // rinde en grano
  const rel = firstVal([gB], n => /relacion caja/.test(n));
  let rindeGrano = null, rgNote = '';
  if (prod != null && haTot) { rindeGrano = prod / haTot * 10; rgNote = 'Producción grano ÷ hectáreas'; }
  else if (rindeQQ != null && rel) { rindeGrano = rindeQQ * rel.value; rgNote = `Rinde caja × relación caja/grano (${nf(rel.value, 4)})`; }
  if (rinde && /caja/.test(rinde.n)) rindeNote += rel ? ` · relación caja/grano ${nf(rel.value, 4)}` : '';
  // resultados del presupuesto
  const resRow = rx => M.B.rows.find(x => rx.test(x.n));
  const resVal = rx => { const x = resRow(rx); if (x && x.total) return { v:x.total, label:x.label }; const f = firstVal([gB], n => rx.test(n)); return f ? { v:f.value, label:f.label } : null; };
  let mn = resVal(/margen neto/), mb = resVal(/margen bruto/), ing = resVal(/ingreso bruto|^ingresos?( totales?)?$|^ventas?$/);
  const precio = firstVal([gB], n => /precio/.test(n) && !/semilla|insumo|gasoil/.test(n));
  // costos
  const totB = state.model.rubros.reduce((a, it) => a + (val(it.b, M.B, sel, all) || 0), 0);
  const totR = state.model.rubros.reduce((a, it) => a + (val(it.r, M.R, sel, all) || 0), 0);
  const totBAll = state.model.rubros.reduce((a, it) => a + (val(it.b, M.B, null, true) || 0), 0);
  // ingreso y margen calculados cuando la planilla no los tiene
  if (!ing && prod != null && precio && haTot) { ing = { v: prod * precio.value / haTot, label:'calc', calc:'Calculado: producción × precio ÷ hectáreas' }; }
  if (!mn && ing && totBAll) {
    mn = { v: ing.v - totBAll, label:'calc', calc:'Calculado: ingreso estimado − costo presupuestado total' };
    notes.push({ t:'La planilla no tiene una fila de margen neto: se calcula como ingreso estimado (producción × precio) − costo total presupuestado. No incluye gastos de comercialización que no estén en el presupuesto.' });
  }
  const src = x => x ? (x.calc || `Fila: "${x.label}"`) : '';
  const arr = findItem(/arrend/);
  const arrV = arr ? itemVals(arr, sel, all) : null;
  const arrBAll = arr ? itemVals(arr, null, true).b : null;
  const C = (cond, c) => cond ? [c] : [];
  const cards = [
    { t:'Hectáreas Olega', v: haO?.value, u:'ha', d:0, n: haO ? `Fila: "${haO.label}"` : '', req:true },
    { t:'Hectáreas en sociedad', v: haS?.value, u:'ha', d:0, n: haS ? `Fila: "${haS.label}"` : '', req:true },
    { t:'Hectáreas totales', v: haTot, u:'ha', d:0, n: haO || haS ? 'Olega + sociedad' : (haTotRow ? `Fila: "${haTotRow.label}"` : ''), extra:true },
    { t:'Producción maní grano estimada', v: prod, u:'tn', d:0, n: prodNote, req:true },
    { t: rinde && /caja/.test(rinde.n) ? 'Rinde estimado (caja)' : 'Rinde estimado', v: rindeQQ, u:'qq/ha', d:1, n: rindeNote, req:true },
    { t:'Rinde estimado (grano)', v: rindeGrano, u:'qq/ha', d:1, n: rgNote, extra:true },
    ...C(precio, { t:'Precio maní grano estimado', v: precio?.value, u:'U$S/tn', d:0, n:`Fila: "${precio?.label}"`, extra:true }),
    ...C(ing, { t:'Ingreso bruto estimado', v: ing?.v, u:'U$S/ha', d:0, n: src(ing), extra:true }),
    ...C(mb, { t:'Margen bruto estimado', v: mb?.v, u:'U$S/ha', d:0, n: src(mb), extra:true }),
    { t:'Margen neto estimado', v: mn?.v, u:'U$S/ha', d:0, n: src(mn), req:true, cls: mn ? (mn.v < 0 ? 'pos' : 'neg') : '' },
    { t:'Costo presupuestado' + (all ? '' : ' (período)'), v: totB, u:'U$S/ha', d:0, n: all ? 'Total campaña' : `${sel.length} mes(es) seleccionados`, extra:true },
    { t:'Costo real' + (all ? '' : ' (período)'), v: totR, u:'U$S/ha', d:0, n: 'Ejecución según cash flow', extra:true },
    { t:'Ejecución del presupuesto anual', v: totBAll ? totR/totBAll*100 : null, u:'%', d:1, n: 'Costo real ÷ presupuesto total campaña', extra:true },
    { t:'Desvío real vs presupuesto', v: totR - totB, u:'U$S/ha', d:0, n: totB ? pf((totR - totB)/Math.abs(totB)) + (totR > totB ? ' · sobre presupuesto' : ' · bajo presupuesto') : '', extra:true, cls: sgn(totR - totB) },
    ...C(arrV, { t:'Arrendamiento real' + (all ? '' : ' (período)'), v: arrV?.r, u:'U$S/ha', d:0, n: arrBAll ? `${nf((arrV?.r || 0) / arrBAll * 100, 0)}% sobre presupuesto ${nf(arrBAll, 0)} U$S/ha` : 'Sin presupuesto de arrendamiento', extra:true }),
    ...C(rindeGrano, { t:'Costo por tonelada de grano', v: totBAll / (rindeGrano/10), u:'U$S/tn', d:0, n:'Costo total presupuestado ÷ rinde grano', extra:true }),
    ...C(precio && precio.value, { t:'Rinde de indiferencia (grano)', v: precio ? totBAll / precio.value * 10 : null, u:'qq/ha', d:1, n:'Rinde que cubre el costo presupuestado', extra:true }),
  ];
  for (const c of cards) if (c.req && c.v == null) notes.push({ miss:true, t:`No se encontró en la planilla: ${c.t}.` });
  if (!precio) notes.push({ t:'No se encontró el precio del maní (cards “Precio” y “Rinde de indiferencia” ocultas).' });
  return { cards, notes };
}

/* ---------- render ---------- */
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function mkChart(id, cfgc){ if (charts[id]) charts[id].destroy(); const el = $(id); if (!el) return; charts[id] = new Chart(el, cfgc); }
function baseOpts(extra = {}, usd = false){
  const g = css('--grid'), t = css('--muted');
  Chart.defaults.font.family = 'Inter, system-ui, sans-serif'; Chart.defaults.color = t;
  return Object.assign({ responsive:true, maintainAspectRatio:false, interaction:{ mode:'index', intersect:false },
    plugins:{ legend:{ position:'bottom', labels:{ usePointStyle:true, boxWidth:8 } }, tooltip:{ callbacks:{ label: c => `${c.dataset.label}: ${fv(c.chart.options.indexAxis === 'y' ? c.parsed.x : c.parsed.y, usd)} ${uLbl(usd)}` } } },
    scales:{ x:{ grid:{ color:g, display:false } }, y:{ grid:{ color:g }, ticks:{ callback: v => fAxis(v, usd) } } } }, extra);
}

function renderFilters(){
  const M = state.model; const keys = M.months.map(m => m.key);
  if (!state.selected) { const saved = store.get('mani_months', null); state.selected = new Set(saved ? saved.filter(k => keys.includes(k)) : keys); if (saved && !state.selected.size) state.selected = new Set(keys); }
  $('monthChips').innerHTML = M.months.map(m => `<button class="chip ${state.selected.has(m.key) ? 'on' : ''}" data-k="${esc(m.key)}">${esc(m.label)}</button>`).join('');
  $('monthCount').textContent = `${state.selected.size} de ${keys.length} meses`;
  $('monthChips').querySelectorAll('.chip').forEach(b => b.onclick = () => { const k = b.dataset.k; state.selected.has(k) ? state.selected.delete(k) : state.selected.add(k); store.set('mani_months', [...state.selected]); render(); });
}
$('selAll').onclick = () => { if (!state.model) return; state.selected = new Set(state.model.months.map(m => m.key)); store.set('mani_months', [...state.selected]); render(); };
$('selExec').onclick = () => { if (!state.model) return; const M = state.model; const ks = M.months.map(m => m.key).filter(k => M.rubros.some(it => it.r && it.r.months[k])); state.selected = new Set(ks); store.set('mani_months', ks); render(); };
$('selNone').onclick = () => { if (!state.model) return; state.selected = new Set(); store.set('mani_months', []); render(); };

function render(){
  const M = state.model; if (!M) return;
  renderFilters();
  const sel = M.months.map(m => m.key).filter(k => state.selected.has(k));
  const all = sel.length === M.months.length && sel.length > 0;
  const { cards, notes: cardNotes } = computeCards(sel, all);
  const rows = M.rubros.map(it => ({ it, ...itemVals(it, sel, all) }));
  const totB = rows.reduce((a, x) => a + (x.b || 0), 0), totR = rows.reduce((a, x) => a + (x.r || 0), 0);

  // avisos
  const notes = [...M.notes, ...cardNotes];
  const unalloc = M.rubros.filter(it => it.b && it.b.total && !Core.sumMonths(it.b, M.B)).map(it => it.label);
  if (unalloc.length) notes.push({ t:'Rubros con total presupuestado pero sin mensualizar (no aparecen en los gráficos mensuales): ' + unalloc.join(', ') });
  if (!all && sel.length) notes.push({ t:'Con meses filtrados, los valores son la suma de esos meses. Con “Todos” se usa la columna total/ha de cada hoja (en U$S totales: total/ha × hectáreas).' });
  $('alerts').style.display = notes.length ? '' : 'none';
  const nm = notes.filter(n => n.miss).length;
  $('alertsSum').innerHTML = `Datos no encontrados y avisos <span class="na-txt">(${nm} no encontrados · ${notes.length - nm} avisos)</span>`;
  $('alertsList').innerHTML = notes.map(n => `<li class="${n.miss ? 'miss' : ''}">${esc(n.t)}</li>`).join('');
  if (nm) $('alerts').open = true;

  const LAB = [['Siembra', /\bsiembra\b/], ['Pulverizaciones', /pulveriz/], ['Desmalezado manual', /desmalez/], ['Arrancada', /arranc/], ['Trilla', /\btrilla/]];
  const labs = LAB.map(([name, rx]) => { const it = findLabor(rx); return { name, it, ...(it ? itemVals(it, sel, all) : { b:null, r:null, d:null, p:null }) }; });
  labs.filter(l => !l.it).forEach(l => notes.push({ miss:true, t:`No se encontró la labor “${l.name}” en ninguna de las dos hojas.` }));
  if (labs.some(l => !l.it)) { $('alertsList').innerHTML = notes.map(n => `<li class="${n.miss ? 'miss' : ''}">${esc(n.t)}</li>`).join(''); $('alerts').style.display = ''; $('alerts').open = true; }

  const cardHtml = cards.map(c => c.v == null || !isFinite(c.v)
    ? `<div class="card na ${c.extra ? 'extra' : ''}"><div class="t">${esc(c.t)}</div><div class="v">No encontrado</div><div class="n">No está en la planilla con un nombre reconocible</div></div>`
    : `<div class="card ${c.extra ? 'extra' : ''}"><div class="t">${esc(c.t)}</div><div class="v ${c.cls || ''}">${nf(c.v, c.d)}<span class="u">${esc(c.u)}</span></div><div class="n">${esc(c.n)}</div></div>`).join('');

  const U = state.unit === 'usd';
  const unitSeg = `<div class="seg unit"><button data-u="ha" class="${!U ? 'on' : ''}">U$S/ha</button><button data-u="usd" class="${U ? 'on' : ''}">U$S totales</button></div>`;
  const barCell = (d, max, txt) => `<td class="${sgn(d)}"><span class="devcell"><span class="track"><span class="bar" style="width:${Math.max(2, Math.round(Math.abs(d||0)/max*80))}px;background:${d > 0 ? css('--bad') : css('--good')}"></span></span><span class="num">${txt}</span></span></td>`;
  const maxAbs = Math.max(1e-9, ...rows.map(x => Math.abs(x.d || 0)));
  const rubroTable = `<table><thead><tr><th>Rubro</th><th>Real</th><th>Presupuesto</th><th>Desvío U$S/ha</th><th>Desvío %</th><th>Ejecución</th></tr></thead><tbody>
    ${rows.map(x => `<tr><td>${esc(x.it.label)}</td><td>${x.it.r ? nf(x.r) : '<span class="na-txt">no está</span>'}</td><td>${x.it.b ? nf(x.b) : '<span class="na-txt">no está</span>'}</td>
      ${barCell(x.d, maxAbs, nf(x.d))}
      <td class="${sgn(x.d)}">${pf(x.p)}</td><td>${x.b ? nf((x.r||0)/x.b*100, 0) + '%' : '—'}</td></tr>`).join('')}
    <tr class="total"><td>Total costos</td><td>${nf(totR)}</td><td>${nf(totB)}</td><td class="${sgn(totR-totB)}">${nf(totR-totB)}</td><td class="${sgn(totR-totB)}">${totB ? pf((totR-totB)/Math.abs(totB)) : '—'}</td><td>${totB ? nf(totR/totB*100, 0) + '%' : '—'}</td></tr>
  </tbody></table>`;

  const labsU = labs.map(l => ({ ...l, ...(l.it ? itemVals(l.it, sel, all, U) : {}) }));
  const laborTable = `<table><thead><tr><th>Labor</th><th>Real</th><th>Presup.</th><th>Desvío</th><th>%</th></tr></thead><tbody>
    ${labsU.map(l => l.it ? `<tr><td>${esc(l.name)}${Core.norm(l.it.label) !== Core.norm(l.name) ? ` <span class="na-txt" title="Fila usada">· ${esc(l.it.label)}</span>` : ''}</td><td>${l.it.r ? fv(l.r, U) : '—'}</td><td>${l.it.b ? fv(l.b, U) : '—'}</td><td class="${sgn(l.d)}">${fv(l.d, U)}</td><td class="${sgn(l.d)}">${pf(l.p)}</td></tr>`
      : `<tr><td>${esc(l.name)}</td><td colspan="4" class="na-txt" style="text-align:left">No encontrado</td></tr>`).join('')}
  </tbody></table>`;

  const rowsU = M.rubros.map(it => ({ it, ...itemVals(it, sel, all, U) }));
  const totBU = rowsU.reduce((a, x) => a + (x.b || 0), 0), totRU = rowsU.reduce((a, x) => a + (x.r || 0), 0);
  const exP = (r, b) => b ? nf((r || 0) / b * 100, 0) + '%' : '—';
  let detail = '';
  rowsU.forEach((x, i) => {
    const has = x.it.children.length;
    detail += `<tr class="${has ? 'parent' : ''}" data-i="${i}"><td>${has ? '<span class="caret">▸</span>' : '<span class="caret"></span>'}${esc(x.it.label)}</td><td>${x.it.r ? fv(x.r, U) : '—'}</td><td>${x.it.b ? fv(x.b, U) : '—'}</td><td class="${sgn(x.d)}">${fv(x.d, U)}</td><td class="${sgn(x.d)}">${pf(x.p)}</td><td>${exP(x.r, x.b)}</td></tr>`;
    for (const c of x.it.children) { const v = itemVals(c, sel, all, U); detail += `<tr class="child hidden" data-p="${i}"><td>${esc(c.label)}</td><td>${c.r ? fv(v.r, U) : '—'}</td><td>${c.b ? fv(v.b, U) : '—'}</td><td class="${sgn(v.d)}">${fv(v.d, U)}</td><td class="${sgn(v.d)}">${pf(v.p)}</td><td>${exP(v.r, v.b)}</td></tr>`; }
  });
  const openRows = new Set([...document.querySelectorAll('tr.parent.open')].map(tr => tr.dataset.i));

  const arr = findItem(/arrend/);
  if (!arr) notes.push({ miss:true, t:'No se encontró el rubro Arrendamientos.' });
  const period = all ? 'campaña completa' : sel.length + ' mes(es)';

  $('content').innerHTML = !M.rubros.length ? `<div class="cards">${cardHtml}</div><div class="panel empty">No se pudieron identificar rubros de costos en las hojas. Revisá los avisos de arriba.</div>` : `
    <div class="cards">${cardHtml}</div>
    <div class="panel full"><div class="ph"><h2>Evolución mensual de costos: real vs presupuesto</h2>
      <span class="hint">U$S totales</span>
      <div class="seg"><button data-m="mensual" class="${state.lineMode==='mensual'?'on':''}">Mensual</button><button data-m="acum" class="${state.lineMode==='acum'?'on':''}">Acumulado</button></div></div>
      <div class="chartbox"><canvas id="cLine"></canvas></div></div>
    <div class="grid2">
      <div class="panel"><div class="ph"><h2>Real vs presupuesto por rubro</h2><span class="hint">U$S totales · ${period}</span></div><div class="chartbox tall"><canvas id="cComp"></canvas></div></div>
      <div class="panel"><div class="ph"><h2>Pagos de arrendamiento por mes</h2><span class="hint">U$S totales · Barras: real · Línea: presupuesto</span></div>
        ${arr ? '<div class="chartbox tall"><canvas id="cArr"></canvas></div>' : '<div class="empty">No se encontró el rubro Arrendamientos en las hojas.</div>'}</div>
    </div>
    <div class="panel full"><div class="ph"><h2>Costos reales vs presupuesto por rubro</h2><span class="hint">U$S/ha · desvío positivo = gasto por encima del presupuesto</span></div><div class="tablewrap">${rubroTable}</div></div>
    <div class="grid2">
      <div class="panel"><div class="ph"><h2>Desvíos en las principales labores</h2><span class="hint">Real − presupuesto, ${uLbl(U)}</span>${unitSeg}</div><div class="chartbox"><canvas id="cLab"></canvas></div></div>
      <div class="panel"><div class="ph"><h2>Detalle de labores</h2><span class="hint">${uLbl(U)}</span>${unitSeg}</div>${laborTable}</div>
    </div>
    <div class="panel full"><div class="ph"><h2>Detalle de todos los rubros</h2><span class="hint">${uLbl(U)} · Click en un rubro para ver su composición · <a href="#" id="expAll">expandir todo</a></span>${unitSeg}</div>
      <div class="tablewrap"><table><thead><tr><th>Rubro / concepto</th><th>Real</th><th>Presupuesto</th><th>Desvío ${uLbl(U)}</th><th>Desvío %</th><th>% Ejecución</th></tr></thead><tbody>${detail}
      <tr class="total"><td>Total costos</td><td>${fv(totRU, U)}</td><td>${fv(totBU, U)}</td><td class="${sgn(totRU-totBU)}">${fv(totRU-totBU, U)}</td><td class="${sgn(totRU-totBU)}">${totBU ? pf((totRU-totBU)/Math.abs(totBU)) : '—'}</td><td>${exP(totRU, totBU)}</td></tr></tbody></table></div></div>`;

  // interacción tablas
  document.querySelectorAll('tr.parent').forEach(tr => { if (openRows.has(tr.dataset.i)) { tr.classList.add('open'); document.querySelectorAll(`tr.child[data-p="${tr.dataset.i}"]`).forEach(c => c.classList.remove('hidden')); } });
  document.querySelectorAll('tr.parent').forEach(tr => tr.onclick = () => { tr.classList.toggle('open'); document.querySelectorAll(`tr.child[data-p="${tr.dataset.i}"]`).forEach(c => c.classList.toggle('hidden', !tr.classList.contains('open'))); });
  const ea = $('expAll'); if (ea) ea.onclick = e => { e.preventDefault(); const open = !document.querySelector('tr.parent.open'); document.querySelectorAll('tr.parent').forEach(tr => tr.classList.toggle('open', open)); document.querySelectorAll('tr.child').forEach(c => c.classList.toggle('hidden', !open)); ea.textContent = open ? 'contraer todo' : 'expandir todo'; };
  document.querySelectorAll('.seg button[data-m]').forEach(b => b.onclick = () => { state.lineMode = b.dataset.m; render(); });
  document.querySelectorAll('.seg button[data-u]').forEach(b => b.onclick = () => { state.unit = b.dataset.u; store.set('mani_unit', state.unit); render(); });

  if (!M.rubros.length) return;
  const cR = css('--real'), cP = css('--ppto'), cBad = css('--bad'), cGood = css('--good');
  const labels = sel.map(k => M.months.find(m => m.key === k).label);
  let lr = sel.map(k => M.rubros.reduce((a, it) => a + (monthVal(it.r, M.R, k, true) || 0), 0));
  let lb = sel.map(k => M.rubros.reduce((a, it) => a + (monthVal(it.b, M.B, k, true) || 0), 0));
  if (state.lineMode === 'acum') { const acc = a => a.map((v, i) => a.slice(0, i+1).reduce((s, z) => s + z, 0)); lr = acc(lr); lb = acc(lb); }
  mkChart('cLine', { type:'line', data:{ labels, datasets:[
    { label:'Real', data:lr, borderColor:cR, backgroundColor:cR + '22', fill:true, tension:.3, borderWidth:2.5, pointRadius:3 },
    { label:'Presupuesto', data:lb, borderColor:cP, borderDash:[6,4], tension:.3, borderWidth:2.5, pointRadius:3 } ] }, options: baseOpts({}, true) });

  const rowsT = M.rubros.map(it => ({ it, ...itemVals(it, sel, all, true) }));
  const sorted = rowsT.sort((a, b) => Math.max(b.b||0, b.r||0) - Math.max(a.b||0, a.r||0));
  mkChart('cComp', { type:'bar', data:{ labels: sorted.map(x => x.it.label), datasets:[
    { label:'Real', data: sorted.map(x => x.r), backgroundColor:cR, borderRadius:4 },
    { label:'Presupuesto', data: sorted.map(x => x.b), backgroundColor:cP, borderRadius:4 } ] },
    options: baseOpts({ indexAxis:'y', interaction:{ mode:'index', intersect:false, axis:'y' }, scales:{ x:{ grid:{ color:css('--grid') }, ticks:{ callback: v => fAxis(v, true) } }, y:{ grid:{ display:false } } } }, true) });

  if (arr) mkChart('cArr', { data:{ labels, datasets:[
    { type:'bar', label:'Real', data: sel.map(k => monthVal(arr.r, M.R, k, true)), backgroundColor:cR, borderRadius:4, order:2 },
    { type:'line', label:'Presupuesto', data: sel.map(k => monthVal(arr.b, M.B, k, true)), borderColor:cP, backgroundColor:cP, borderWidth:2.5, pointRadius:4, tension:.25, order:1 } ] }, options: baseOpts({}, true) });

  const lf = labsU.filter(l => l.it);
  mkChart('cLab', { type:'bar', data:{ labels: lf.map(l => l.name), datasets:[{ label:'Desvío', data: lf.map(l => l.d), backgroundColor: lf.map(l => l.d > 0 ? cBad : cGood), borderRadius:4 }] },
    options: baseOpts({ plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label: c => `Desvío: ${fv(c.parsed.y, U)} ${uLbl(U)} (${pf(lf[c.dataIndex].p)})` } } } }, U) });

  $('footer').innerHTML = `Fuente: ${esc(M.meta.label)} · Real: hoja “${esc(M.meta.rn || '—')}” (A:${esc(cfg.realLastCol)}) · Presupuesto: hoja “${esc(M.meta.bn || '—')}” (A:${esc(cfg.budgetLastCol)})` + (state.loadedAt ? ` · Última lectura ${state.loadedAt.toLocaleString('es-AR')}` : '') + (state.source === 'live' && +cfg.refreshMin ? ` · se actualiza cada ${cfg.refreshMin} min` : '');
}

/* ---------- configuración ---------- */
function openCfg(){ $('cfgId').value = cfg.sheetId; $('cfgReal').value = cfg.realName; $('cfgBud').value = cfg.budgetName; $('cfgRealCol').value = cfg.realLastCol; $('cfgBudCol').value = cfg.budgetLastCol; $('cfgRefresh').value = cfg.refreshMin; $('modal').classList.add('show'); }
$('btnSettings').onclick = openCfg;
$('cfgCancel').onclick = () => $('modal').classList.remove('show');
$('cfgReset').onclick = () => { cfg = Object.assign({}, DEFAULTS); store.set('mani_cfg', {}); openCfg(); };
$('cfgSave').onclick = () => {
  let id = $('cfgId').value.trim(); const m = id.match(/\/d\/([a-zA-Z0-9_-]+)/); if (m) id = m[1];
  cfg = Object.assign({}, cfg, { sheetId:id, realName:$('cfgReal').value.trim(), budgetName:$('cfgBud').value.trim(), realLastCol:$('cfgRealCol').value.trim().toUpperCase() || 'Q', budgetLastCol:$('cfgBudCol').value.trim().toUpperCase() || 'R', refreshMin: Math.max(0, +$('cfgRefresh').value || 0) });
  store.set('mani_cfg', cfg); $('modal').classList.remove('show'); start();
};
$('btnRefresh').onclick = () => loadLive();

function start(){
  $('lnkSheet').href = sheetUrl();
  clearInterval(timer); loadLive();
  if (+cfg.refreshMin > 0) timer = setInterval(() => { if (state.source !== 'local' && !document.hidden) loadLive(); }, cfg.refreshMin * 60000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.source === 'live' && state.loadedAt && Date.now() - state.loadedAt > 60000) loadLive(); });
if (typeof Chart === 'undefined' || typeof XLSX === 'undefined') { $('content').innerHTML = '<div class="panel empty">No se pudieron cargar las librerías (Chart.js / SheetJS). Revisá la conexión a internet.</div>'; setStatus('err','Sin librerías'); }
else start();
})();
</script>
</body>
</html>
